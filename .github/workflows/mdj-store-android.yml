name: MDJ Store Build (Android AAB)

# Play-Store build of the MDJ Travel Guide app (Maya 2026-08-06):
#   - identity: com.mydailyjourneys.app / "MDJ Travel Guide" (MDJ_STORE_BUILD=1)
#   - output:   signed .aab (Play requires app bundles, not APKs)
#   - signing:  upload keystore from repo secrets (MDJ_UPLOAD_KEYSTORE_B64 +
#               MDJ_UPLOAD_STORE_PASSWORD); gradle picks it up via the
#               existing credentials/ + MENTRAOS_UPLOAD_* mechanism.
# The sideload APK workflow (mdj-android.yml) is unchanged — the rental fleet
# keeps its current identity until we consciously migrate it.

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Provide .env
        working-directory: mobile
        run: cp .env.example .env

      - name: Restore upload keystore from secret
        working-directory: mobile
        env:
          KS_B64: ${{ secrets.MDJ_UPLOAD_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then echo "MDJ_UPLOAD_KEYSTORE_B64 secret missing"; exit 1; fi
          mkdir -p credentials
          echo "$KS_B64" | base64 -d > credentials/upload-keystore.jks
          ls -la credentials/

      - name: Install JS deps
        working-directory: mobile
        run: bun install

      - name: Expo prebuild (Android, MDJ store identity)
        working-directory: mobile
        env:
          MDJ_STORE_BUILD: '1'
        run: npx expo prebuild --platform android --no-install

      - name: Build signed AAB
        working-directory: mobile/android
        env:
          MDJ_STORE_BUILD: '1'
          ORG_GRADLE_PROJECT_MENTRAOS_UPLOAD_STORE_PASSWORD: ${{ secrets.MDJ_UPLOAD_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_MENTRAOS_UPLOAD_KEY_PASSWORD: ${{ secrets.MDJ_UPLOAD_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_MENTRAOS_UPLOAD_KEY_ALIAS: upload
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Verify signing (must NOT be the debug key)
        run: |
          AAB=$(ls mobile/android/app/build/outputs/bundle/release/*.aab)
          jarsigner -verify -verbose:summary "$AAB" | tail -3
          if unzip -p "$AAB" META-INF/*.RSA 2>/dev/null | keytool -printcert | grep -q "CN=Android Debug"; then
            echo "::error::AAB is signed with the DEBUG key — secrets not applied"; exit 1
          fi

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: MDJ-store-aab
          path: mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
